[project]
name = "barbershop-queue-bot"
version = "1.0.0"
description = "Telegram queue bot for a barbershop in Uzbekistan"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::RuntimeWarning",
    "ignore::DeprecationWarning",
]
