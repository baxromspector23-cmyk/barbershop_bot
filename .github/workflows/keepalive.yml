name: Render Keep-Alive Ping

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        run: |
          curl -fsSL --retry 3 --max-time 15 https://barbershop-bot-site.onrender.com/healthz || true
